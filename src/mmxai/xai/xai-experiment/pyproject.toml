[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmxai-xai-experiment"
version = "0.1.0"
description = "Faithful perturbation explanations for graph-enhanced text-to-image retrieval"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]
notebooks = ["pandas>=2", "matplotlib>=3.7", "openpyxl>=3.1", "requests>=2.31", "certifi>=2024.2.2"]

[tool.setuptools]
packages = ["xai_experiment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

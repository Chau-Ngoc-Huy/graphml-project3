[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmxai-xai"
version = "0.1.0"
description = "Faithful perturbation explanations for graph-enhanced text-to-image retrieval"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["xai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


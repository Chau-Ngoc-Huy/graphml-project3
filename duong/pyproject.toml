[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmxai-xai"
version = "0.1.0"
description = "Faithful perturbation explanations for graph-enhanced text-to-image retrieval"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
viz = ["matplotlib>=3.7", "networkx>=3.1"]
dev = ["pytest>=7.4"]

[project.scripts]
mmxai-xai-demo = "xai.cli:main"

[tool.setuptools]
packages = ["xai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


# Số trong paper để tools/compare.py so với lượt chạy của mình. Chép đúng từ bảng gốc (tex trong docs/paper_src/ nếu có),
# ghi rõ bảng/dòng/cột. `ours` = khóa trong metrics.json của lượt (dạng phẳng a.b); `paper_scale` nhân vào số của mình
# (vd. paper ghi % còn mình trả 0..1 → 100). `tolerance` tuyệt đối theo đơn vị của paper.
paper:
  title: "Project 3 - Truy vấn đa phương thức có giải thích bằng đồ thị (Graph ML)"
  url: ""
tolerance: 1.0
tables:
  - id: table1
    caption: "Bảng 1 — kết quả chính (ví dụ, sửa lại)"
    note: "Paper báo mean của 3 seed; mình chạy 1 seed."
    metrics:
      accuracy: {ours: "accuracy", paper_scale: 100, fmt: "{:.1f}", tolerance: 1.0}
    rows:
      - name: "Baseline (ví dụ)"
        exp: smoke          # thí nghiệm của mình; lấy lượt đầy đủ mới nhất, hoặc ghim run_id: ...
        paper: {accuracy: 50.0}
